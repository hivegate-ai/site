name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  # Fired by hivegate-ai/docs on every push to its main branch, so the synced
  # /docs/* reference pages update without a site commit.
  repository_dispatch:
    types: [docs-updated]
  # Daily rebuild as a fallback in case a docs dispatch is missed.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5

      - name: Pull detailed API docs from hivegate-ai/docs
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hivegate-ai/docs.git _api-docs-src
          mkdir -p _docs
          # Skip Sphinx-only files (conf.py, Makefile, _build/, API_DOCUMENTATION.md is huge — include separately)
          for f in _api-docs-src/*.md; do
            name=$(basename "$f")
            slug="${name%.md}"
            # Skip the all-in-one mega-file; we want per-topic pages for clean URLs/SEO
            if [ "$slug" = "API_DOCUMENTATION" ]; then
              continue
            fi
            # Skip the docs-repo index.md — we have our own /docs/ page
            if [ "$slug" = "index" ]; then
              continue
            fi
            # Pretty title: "api-agents" → "API Agents"
            title=$(echo "$slug" | sed -E 's/-/ /g' | awk '{for(i=1;i<=NF;i++)$i=toupper(substr($i,1,1)) substr($i,2)} 1')
            {
              echo "---"
              echo "layout: default"
              echo "title: \"$title — HiveGate docs\""
              echo "permalink: /docs/$slug/"
              echo "---"
              echo ""
            } > "_docs/$name"
            cat "$f" >> "_docs/$name"
          done
          echo "Synced $(ls _docs | wc -l) detailed doc pages."

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex and other IndexNow engines that the site changed.
  # Skipped on the daily fallback rebuild, which usually changes nothing.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 17edebe410ddc0fe984d8f6784bc975a
        run: |
          set -euo pipefail
          urls=$(curl -fsS https://hivegate.dev/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##')
          body=$(printf '%s\n' "$urls" | python3 -c 'import json,os,sys; print(json.dumps({"host": "hivegate.dev", "key": os.environ["INDEXNOW_KEY"], "keyLocation": "https://hivegate.dev/" + os.environ["INDEXNOW_KEY"] + ".txt", "urlList": [u for u in sys.stdin.read().split() if u]}))')
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded $status for $(printf '%s\n' "$urls" | wc -l) URLs"
          case "$status" in 200|202) ;; *) exit 1 ;; esac
