---
layout: default
---
<article class="post">
  <p class="post-kicker"><a href="/blog/" data-goatcounter-click="click_blog" data-goatcounter-title="Post — Blog index">Blog</a> &middot; <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {%- if page.description %}
  <p class="post-lead">{{ page.description }}</p>
  {%- endif %}
  {{ content }}
</article>
